name: daily_insti_scan

on:
  schedule:
    - cron: "41 12 * * 1-5"
    - cron: "53 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Insti Scanner
        run: python3 insti_scanner.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add insti_live_data.json history/all.json history/delivery.json INSTI_Deals.csv INSTI_Accumulation.csv INSTI_WeeklyTop5.csv INSTI_FortnightlyTop5.csv INSTI_MonthlyTop5.csv INSTI_TriplePositive.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🐘 Insti scan [$(date +%Y-%m-%d)]"
            git push
          fi
